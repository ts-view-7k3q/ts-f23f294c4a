<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guard">
<meta name="theme-color" content="#0f1720">
<title>Guard Control</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#0f1720;--mut:#5b6773;--line:#dde3e9;--acc:#0b6bcb;--ok:#0a7d4b;--warn:#b25e00;--bad:#c0262d;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1118;--card:#121b25;--fg:#e8eef4;--mut:#8b99a8;--line:#223040;--acc:#4da3ff;--ok:#38c98a;--warn:#f0a040;--bad:#ff6b72;--inp:#0b1118}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.row label{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-size:12px}
input[type=text],input[type=password],input[type=number]{width:120px;font-size:17px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--fg);text-align:right}
input.wide{width:100%;text-align:left}
button{font-size:16px;padding:12px 14px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.bad{background:var(--bad)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{margin:0;padding:10px;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv div{min-width:0}.kv b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bad2{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.sec-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.msg{font-size:14px;margin-top:8px;color:var(--mut)}
select{font-size:17px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--fg)}
.chg{font-size:15px;padding:4px 0;border-bottom:1px dashed var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>Guard Control</h1>

<div id="setup" class="card" hidden>
  <div class="sec-t">One-time setup on this phone</div>
  <div class="row"><label>Repository<small>owner/name of your private control repo</small></label></div>
  <input id="s_repo" class="wide" type="text" placeholder="yourname/guard-ctl" autocapitalize="off" autocorrect="off">
  <div class="row"><label>Access token<small>stays on this phone only</small></label></div>
  <input id="s_tok" class="wide" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off">
  <button id="s_save">Save</button>
  <div class="msg" id="s_msg"></div>
</div>

<div id="unlock" class="card" hidden>
  <div class="sec-t">Passphrase</div>
  <input id="u_pw" class="wide" type="password" placeholder="your passphrase" autocapitalize="off" autocorrect="off">
  <div class="row"><label>Remember on this phone<small>skip typing it next time</small></label><input id="u_rem" type="checkbox"></div>
  <button id="u_go">Unlock</button>
  <button id="u_reset" class="sec">Change repository / token</button>
  <div class="msg" id="u_msg"></div>
</div>

<div id="main" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="statcard"></div>
  <div class="card" id="pendcard" hidden></div>
  <div class="card" id="form"></div>
  <div class="card" id="review" hidden></div>
  <div class="msg" id="m_msg"></div>
  <button id="lock" class="sec">Lock</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let repo=LS.get('g_repo')||'',tok=LS.get('g_tok')||'',keyHex=LS.get('g_key')||'';
let logins=[],cur='',stats={},timer=null,edits={};
const LOOSEN_MIN=10;
const SALT='guardctl-v1';

/* ---------- github ---------- */
async function gh(method,path,body){
  const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path+(method==='GET'?'?t='+Date.now():''),{method,cache:'no-store',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  return {s:r.status,j};
}
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const b64e=s=>btoa(unescape(encodeURIComponent(s)));

/* ---------- crypto (same maths as the VPS poller) ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function derive(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(SALT),iterations:200000},k,256));
}
async function sign(msg){
  const k=await crypto.subtle.importKey('raw',unhex(keyHex),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  return hex(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg)));
}
const message=(login,seq,set,cancel)=>login+'|'+seq+'|'+Object.keys(set).sort().map(k=>k+'='+set[k]).join(';')+'|'+(cancel?'1':'0');

/* ---------- screens ---------- */
function show(which){for(const id of['setup','unlock','main'])$(id).hidden=id!==which}
function boot(){
  if(!repo||!tok){show('setup');return}
  if(keyHex){start();return}
  show('unlock');
}
$('s_save').onclick=async()=>{
  const r=$('s_repo').value.trim(),t=$('s_tok').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(r)||t.length<20){$('s_msg').textContent='Check the repository name and token.';return}
  repo=r;tok=t;$('s_msg').textContent='Checking…';
  const x=await gh('GET','status');
  if(x.s===404){$('s_msg').textContent='Saved. No account status yet - the VPS has not reported. Continue anyway.'}
  else if(x.s===401||x.s===403){$('s_msg').textContent='GitHub refused the token (error '+x.s+').';return}
  else if(x.s!==200){$('s_msg').textContent='Could not reach the repository (error '+x.s+').';return}
  LS.set('g_repo',repo);LS.set('g_tok',tok);boot();
};
$('u_reset').onclick=()=>{LS.del('g_repo');LS.del('g_tok');LS.del('g_key');repo=tok=keyHex='';show('setup')};
$('u_go').onclick=async()=>{
  const pw=$('u_pw').value;if(pw.length<10){$('u_msg').textContent='At least 10 characters.';return}
  $('u_msg').textContent='Unlocking…';keyHex=await derive(pw);$('u_pw').value='';
  if($('u_rem').checked)LS.set('g_key',keyHex);
  start();
};
$('lock').onclick=()=>{LS.del('g_key');keyHex='';clearInterval(timer);show('unlock')};

async function start(){
  show('main');$('m_msg').textContent='Loading…';
  const d=await gh('GET','status');
  if(d.s===200&&Array.isArray(d.j))logins=d.j.map(f=>f.name.replace(/\.json$/,'')).filter(n=>/^\d+$/.test(n));
  else logins=[];
  if(!logins.length){$('m_msg').textContent='No accounts reported yet. Check the VPS poller is running.';return}
  if(!cur||!logins.includes(cur))cur=logins[0];
  drawTabs();await refresh();
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)refresh()},15000);
}
function drawTabs(){
  $('tabs').innerHTML='';
  logins.forEach(l=>{const b=document.createElement('button');b.textContent='…'+l.slice(-4);b.title=l;if(l===cur)b.className='on';b.onclick=()=>{cur=l;edits={};$('review').hidden=true;drawTabs();draw()};$('tabs').appendChild(b)});
}
async function refresh(){
  for(const l of logins){
    const x=await gh('GET','status/'+l+'.json');
    if(x.s===200)try{stats[l]=JSON.parse(b64d(x.j.content))}catch(e){}
    else if(x.s===401||x.s===403){$('m_msg').textContent='Token refused (error '+x.s+').';return}
  }
  $('m_msg').textContent='';draw();
}

/* ---------- drawing ---------- */
const money=v=>v==null?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
function ago(t){if(!t)return '-';const s=Math.max(0,Math.round(Date.now()/1000-t));return s<90?s+'s ago':s<5400?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
function fields(s){
  const keys=s.keys||[];
  const f=[
    {n:'ACCT',t:'Account daily loss limit',u:'$ · 0 = off',cur:s.st.LIMACCT,step:'1'},
    {n:'TOTAL',t:'Max total net lots',u:'all pairs · 0 = off',cur:s.st.MAXTOT,step:'0.01'}];
  keys.forEach(k=>{
    f.push({n:'LIM_'+k,t:k+' daily loss limit',u:'$ · 0 = off',cur:s.st['LIM_'+k],step:'1'});
    f.push({n:'MAX_'+k,t:k+' max net lots',u:'0 = off',cur:s.st['MAX_'+k],step:'0.01'});
  });
  return f;
}
function draw(){
  const s=stats[cur];if(!s){return}
  const st=s.st,age=Math.round(Date.now()/1000-s.ts);
  const eaOk=s.ea_age!=null&&s.ea_age<30,fresh=age<180;
  const locked=st.LOCK>0;
  $('statcard').innerHTML='<div class="row"><b>Account '+cur+'</b><span>'+(!fresh?'<span class="pill bad2">VPS silent</span>':!eaOk?'<span class="pill warn">EA not reporting</span>':'<span class="pill ok">live</span>')+'</span></div>'+
   '<div class="kv"><div><b>Equity</b>'+money(st.EQ)+'</div><div><b>Today P/L</b>'+money(st.DAYPL)+'</div><div><b>Day-open equity</b>'+money(st.OPEN)+'</div><div><b>Floor (limit hit at)</b>'+(st.LIMACCT>0?money(st.FLOOR):'off')+'</div><div><b>Open lots (buy / sell)</b>'+money(st.BUY)+' / '+money(st.SELL)+'</div><div><b>State</b>'+(locked?'<span class="pill bad2">LOCKED</span>':'<span class="pill ok">trading allowed</span>')+'</div></div>'+
   '<div class="msg">Updated '+ago(s.ts)+(s.result?' · last command: '+s.result+' ('+ago(s.result_ts)+')':'')+'</div>';
  const nOv=Object.keys(s.overrides||{}).length,phoneOn=nOv>0||(st.PHONE>0);
  $('statcard').innerHTML+='<div class="row" style="margin-top:8px"><b>Control</b><span>'+(phoneOn?'<span class="pill warn">PHONE ('+Math.max(nOv,st.PHONE||0)+' active)</span>':'<span class="pill ok">DESK (nothing from phone)</span>')+'</span></div>'+
   (phoneOn?'<div class="msg">Phone values override the MT5 inputs. Change any input in MT5 at your desk and they clear by themselves, or reset here.</div><button class="bad" id="resetp">Reset phone control (I am at my desk)</button>':'');
  if($('resetp'))$('resetp').onclick=()=>{const b=$('resetp');if(b.dataset.sure){send({RESET:'1'},false)}else{b.dataset.sure='1';b.textContent='Tap again to confirm (waits 2 min, cancellable)'}};
  const p=s.pending;
  if(p){const left=Math.max(0,Math.round(p.at-Date.now()/1000));$('pendcard').hidden=false;
    $('pendcard').innerHTML='<div class="sec-t">Loosening waiting</div>'+Object.keys(p.set).map(k=>'<div class="chg">'+(k==='RESET'?'Reset phone control (back to MT5 desk values)':k+' → '+p.set[k])+'</div>').join('')+'<div class="msg">Applies in '+Math.ceil(left/60)+' min unless cancelled.</div><button class="bad" id="cancelp">Cancel pending change</button>';
    $('cancelp').onclick=()=>send({},true);
  }else $('pendcard').hidden=true;
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#form'))return; // do not disturb typing
  let h='<div class="sec-t">Protection</div>';
  const lossNow=(st.LIMACCT>0&&st.FLOOR!=null&&st.EQ!=null)?Math.max(0,st.EQ-st.FLOOR):null;
  const F3=[
   {n:'LOSS',t:'Max loss allowed from current equity',u:'$ · 0 = off',cur:lossNow,step:'1',nowtxt:lossNow==null?'off':money(lossNow)+' (floor '+money(st.FLOOR)+')'},
   {n:'LOTS',t:'Max lots allowed',u:'total, all pairs · 0 = off',cur:st.MAXTOT,step:'0.01'},
   {n:'SLPIPS',t:'Stop loss in pips',u:'put on trades that have none · 0 = off',cur:st.SLPIPS,step:'1'}];
  F3.forEach(f=>{
    const v=edits[f.n]!==undefined?edits[f.n]:(f.cur==null?'':(f.n==='LOSS'?Math.round(f.cur):f.cur));
    h+='<div class="row"><label>'+f.t+'<small>'+f.u+' · now '+(f.nowtxt||(f.cur==null?'-':money(f.cur)))+'</small></label><input type="number" inputmode="decimal" step="'+f.step+'" min="0" data-n="'+f.n+'" value="'+v+'"></div>';
  });
  const tr=edits.TRADE!==undefined?edits.TRADE:'';
  h+='<div class="row"><label>Trading allowed<small>Not allowed closes every trade and order at once · now '+(st.TRADE==null?'-':(st.TRADE>0?'allowed':'NOT allowed'))+'</small></label><select data-n="TRADE"><option value=""'+(tr===''?' selected':'')+'>No change</option><option value="1"'+(tr==='1'?' selected':'')+'>Allowed</option><option value="0"'+(tr==='0'?' selected':'')+'>Not allowed</option></select></div>';
  h+='<div class="msg">Loss is counted from your equity right now. When it is hit: '+(st.ACTION==1?'close all':'hedge')+'.</div>';
  h+='<button id="review_b">Review changes</button>';
  $('form').innerHTML=h;
  $('form').querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{edits[e.dataset.n]=e.value});
  $('review_b').onclick=reviewChanges;
}

/* ---------- changes ---------- */
function loosen(n,old,nw){
  if(n==='ACTION')return old==1&&nw==0;
  if(n==='TRADE')return nw==1;
  if(n==='TRANSP')return false;
  if(old==null)return true;
  const inf=1e18,o=old<=0?inf:old,x=nw<=0?inf:nw;return x>o+1e-9;
}
const LOTR={XAUUSD:[0.02,0.30],BTCUSD:[0.01,0.05],EURUSD:[0.01,0.30]};
function reviewChanges(){
  const s=stats[cur],st=s.st,ch={},show=[];let h='<div class="sec-t">Review</div>',lo=false;
  const curv={ACCT:st.LIMACCT,TOTAL:st.MAXTOT,ACTION:st.ACTION,SLPIPS:st.SLPIPS,TRADE:st.TRADE};
  (s.keys||[]).forEach(k=>curv['MAX_'+k]=st['MAX_'+k]);
  const put=(n,nv,label)=>{const old=curv[n];if(old!=null&&Math.abs(nv-old)<1e-9)return false;ch[n]=String(nv);const l=loosen(n,old,nv);if(l)lo=true;return l};
  const ok=n=>edits[n]!==undefined&&edits[n]!==''&&!isNaN(Number(edits[n]));
  if(ok('LOSS')){
    const x=Number(edits.LOSS);let lim=0,floor=null;
    if(x>0){lim=Math.round((x+(st.OPEN-st.EQ))*100)/100;if(lim<1)lim=1;floor=st.OPEN-lim}
    const old=curv.ACCT,oldf=st.LIMACCT>0?st.FLOOR:null;
    if(!(old!=null&&Math.abs(lim-old)<0.005)){const l=put('ACCT',lim);
      h+='<div class="chg">Max loss: '+(oldf==null?'off':money(st.EQ-oldf))+' → <b>'+(x>0?money(x):'off')+'</b>'+(floor!=null?' · trading stops if equity falls to <b>'+money(floor)+'</b>':'')+' <span class="pill '+(l?'warn':'ok')+'">'+(l?'looser · waits '+LOOSEN_MIN+' min':'applies now')+'</span></div>'}
  }
  if(ok('LOTS')){
    const v=Number(edits.LOTS);let l1=put('TOTAL',v);
    (s.keys||[]).forEach(k=>{const r=LOTR[k];let m=v;if(v>0&&r)m=Math.min(r[1],Math.max(r[0],v));if(put('MAX_'+k,m))l1=true});
    if('TOTAL' in ch||Object.keys(ch).some(k=>k.startsWith('MAX_')))
      h+='<div class="chg">Max lots: '+(st.MAXTOT>0?money(st.MAXTOT):'off')+' → <b>'+(v>0?money(v):'off')+'</b> <span class="pill '+(l1?'warn':'ok')+'">'+(l1?'looser · waits '+LOOSEN_MIN+' min':'applies now')+'</span></div>';
  }
  if(ok('SLPIPS')){
    const v=Number(edits.SLPIPS),old=curv.SLPIPS;
    if(!(old!=null&&Math.abs(v-old)<1e-9)){const l=put('SLPIPS',v);
      h+='<div class="chg">Stop loss: '+(old>0?money(old)+' pips':'off')+' → <b>'+(v>0?money(v)+' pips':'off')+'</b> <span class="pill '+(l?'warn':'ok')+'">'+(l?'looser · waits '+LOOSEN_MIN+' min':'applies now')+'</span></div>'}
  }
  if(ok('TRADE')){
    const v=Number(edits.TRADE),old=st.TRADE;
    if(!(old!=null&&Math.abs(v-old)<1e-9)){const l=put('TRADE',v);
      h+='<div class="chg">Trading: '+(old==null?'-':(old>0?'allowed':'not allowed'))+' → <b>'+(v>0?'allowed':'NOT allowed (closes all trades and orders)')+'</b> <span class="pill '+(l?'warn':'ok')+'">'+(l?'looser · waits '+LOOSEN_MIN+' min':'applies now')+'</span></div>'}
  }
  const rv=$('review');rv.hidden=false;
  if(!Object.keys(ch).length){rv.innerHTML='<div class="msg">No changes.</div>';return}
  rv.innerHTML=h+(lo?'<div class="msg">Loosening is held for '+LOOSEN_MIN+' minutes. You can cancel it until then.</div>':'')+'<button id="confirm_b">'+(lo?'Confirm (looser parts wait '+LOOSEN_MIN+' min)':'Confirm and apply')+'</button><button id="back_b" class="sec">Back</button>';
  $('confirm_b').onclick=()=>send(ch,false);
  $('back_b').onclick=()=>{rv.hidden=true};
}
async function send(set,cancel){
  const rv=$('review');$('m_msg').textContent='Sending…';
  const seq=Date.now(),msg=message(cur,seq,set,cancel);
  const cmd={v:1,login:cur,seq,set,cancel,sig:await sign(msg)};
  const old=await gh('GET','cmd/'+cur+'.json');
  const body={message:'cmd',content:b64e(JSON.stringify(cmd))};if(old.s===200)body.sha=old.j.sha;
  const r=await gh('PUT','cmd/'+cur+'.json',body);
  if(r.s!==200&&r.s!==201){$('m_msg').textContent='Could not send (error '+r.s+').';return}
  rv.hidden=true;edits={};
  $('m_msg').textContent='Sent. Waiting for the VPS…';
  for(let i=0;i<14;i++){
    await new Promise(r=>setTimeout(r,6000));await refresh();
    const s=stats[cur];if(s&&s.last_seq>=seq){$('m_msg').textContent='VPS: '+s.result;return}
  }
  $('m_msg').textContent='Sent, but the VPS has not answered yet. Check the poller is running.';
}
boot();
</script>
</body>
</html>
